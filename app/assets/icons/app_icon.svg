<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="78%">
      <stop offset="0%" stop-color="#142043"/>
      <stop offset="55%" stop-color="#080D1B"/>
      <stop offset="100%" stop-color="#05070D"/>
    </radialGradient>
    <linearGradient id="wave" x1="180" y1="0" x2="780" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2E8BFF"/>
      <stop offset="50%" stop-color="#46E0FF"/>
      <stop offset="100%" stop-color="#1B4DFF"/>
    </linearGradient>
    <linearGradient id="dot" x1="784" y1="458" x2="892" y2="566" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9BF6FF"/>
      <stop offset="100%" stop-color="#2E8BFF"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>

  <!-- Onda sonora: barras verticais arredondadas de alturas variadas -->
  <g filter="url(#glow)" fill="none" stroke="url(#wave)" stroke-width="36" stroke-linecap="round">
    <path d="M300 404 L300 620"/>
    <path d="M410 336 L410 688"/>
    <path d="M520 268 L520 756"/>
    <path d="M630 352 L630 672"/>
    <path d="M740 436 L740 588"/>
  </g>

  <!-- Ponto de gravação -->
  <circle cx="838" cy="512" r="52" fill="url(#dot)" filter="url(#glow)"/>
</svg>
