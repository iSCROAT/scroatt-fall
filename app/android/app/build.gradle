plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.scrott.voice"
    // `flutter.compileSdkVersion` aponta para o SDK estável atual do
    // Flutter (36 no 3.50.x). Alguns plugins exigem compileSdk >= 35.
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // `flutter_local_notifications` exige core library desugaring
        // para usar APIs de java.time em Android mais antigo.
        // No AGP 8.x a propriedade e `coreLibraryDesugaringEnabled`
        // (a variante `is...` pertence ao DSL do Kotlin).
        coreLibraryDesugaringEnabled = true
    }


    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId = "com.scrott.voice"
        // `record` e `audio_decoder` exigem minSdk 23 (Android 6.0).
        // Mantemos 23 para que o APK instale tambem em aparelhos
        // Android 6 — o sistema recusa o pacote com "problema ao
        // analisar o pacote" quando o minSdk e maior que a versao do
        // aparelho.
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName

    }

    buildTypes {
        release {
            // Assinatura de debug para permitir `flutter build apk --release`
            // no CI sem keystore de produção.
            signingConfig = signingConfigs.debug
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

// AGP 9 / Kotlin 2.4: as opcoes do compilador ficam no bloco `kotlin`.
// O alvo do bytecode precisa ser o mesmo do `compileOptions`, senao o
// Kotlin gera classes com um nivel de bytecode que o Java 17 do
// dispositivo nao consegue executar.
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source = "../.."
}

dependencies {
    // Desugaring das APIs de java.time exigidas pelas notificacoes.
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    // NotificationCompat e NotificationChannel.
    implementation "androidx.core:core-ktx:1.13.1"
}
