org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Padrao do AGP 9: cada modulo le apenas os recursos do seu proprio
# namespace. Sem isso, o build falha ao resolver os recursos dos plugins.
android.nonTransitiveRClass=true
# O R8 (build de release) exige IDs de recurso nao finais para fazer
# o "resource shrinking" otimizado.
android.nonFinalResIds=true
