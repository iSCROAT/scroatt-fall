name: scrott_voice
description: "Scroatt — gravador de voz com transcrição inteligente."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Gravação de áudio com medição de amplitude em tempo real.
  # 6.2.1 é a última versão da série 6 (a série 7 exige Flutter >= 3.44).
  record: ^6.2.1
  # Reprodução das gravações.
  just_audio: ^0.9.42
  # Permissão de microfone com detecção de bloqueio permanente.
  permission_handler: ^11.3.1
  # Persistência do índice de gravações e do rascunho.
  shared_preferences: ^2.3.3
  # Ícones vetoriais (Feather Icons empacotados como assets SVG).
  flutter_svg: ^2.0.14
  # Caminhos do sistema de arquivos do app.
  path_provider: ^2.1.4
  # Decodificacao e edicao real de audio: converte o `.m4a` gravado em
  # PCM via APIs nativas do Android (sem FFmpeg), o que permite cortar,
  # ajustar volume e aplicar efeitos de voz no arquivo de verdade.
  audio_decoder: ^0.8.1
  # Notificacao persistente do gravador com acoes de acesso rapido
  # (pausar, continuar, parar) e temporizador sincronizado.
  # A serie 23+ exige Flutter >= 3.44; a 18.x e a ultima compativel com
  # o Flutter 3.35.7 usado no CI.
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
