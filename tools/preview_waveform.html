<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Scroatt — prévia da waveform</title>
<style>
  body {
    margin: 0; padding: 32px;
    background: #05070D;
    font-family: system-ui, -apple-system, sans-serif;
    color: #F4F7FF;
    display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start;
  }
  .card {
    background: linear-gradient(180deg, #070B16, #05070D);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 20px; padding: 22px;
    width: 360px;
  }
  h3 { margin: 0 0 14px; font-size: 14px; font-weight: 600; color: #A7B2CC; }
  svg { display: block; width: 100%; }
</style>
</head>
<body>
  <div class="card">
    <h3>Malha (tela de gravação)</h3>
    <svg id="mesh" viewBox="0 0 320 190"></svg>
  </div>
  <div class="card">
    <h3>Barras (tela de edição)</h3>
    <svg id="bars" viewBox="0 0 320 96"></svg>
  </div>

<script>
// ---------------------------------------------------------------------------
// Réplica em JS da matemática do CustomPainter (WaveformView) para conferir
// visualmente o resultado antes de compilar o app.
// ---------------------------------------------------------------------------
const DEEP = '#1B4DFF', MID = '#2E8BFF', BRIGHT = '#46E0FF', CYAN = '#7AF3FF';
const GRAD = [DEEP, MID, BRIGHT, CYAN];

function synthetic(i) {
  const a = Math.sin(i * 0.19) * 0.30;
  const b = Math.sin(i * 0.51 + 1.3) * 0.22;
  const c = Math.sin(i * 0.93 + 2.6) * 0.12;
  return Math.min(1, Math.max(0.06, 0.5 + a + b + c));
}

function paintMesh(svg, W, H, phase) {
  const NS = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  const defs = document.createElementNS(NS, 'defs');
  const g = document.createElementNS(NS, 'linearGradient');
  g.setAttribute('id', 'wg'); g.setAttribute('x1','0'); g.setAttribute('y1','0');
  g.setAttribute('x2','1'); g.setAttribute('y2','1');
  [[0, GRAD[0], .25],[.5, CYAN, .10],[1, GRAD[1], .30]].forEach(([o,c,a])=>{
    const s = document.createElementNS(NS,'stop');
    s.setAttribute('offset', o); s.setAttribute('stop-color', c);
    s.setAttribute('stop-opacity', a); g.appendChild(s);
  });
  defs.appendChild(g); svg.appendChild(defs);

  const layers = 7, centerY = H/2, amplitude = H*0.40;
  const basePeaks = Array.from({length:120}, (_,i)=>synthetic(i));

  for (let layer=0; layer<layers; layer++) {
    const layerPhase = phase + layer*0.55;
    const layerAmp = amplitude*(1-layer*0.075);
    let d = '';
    const segments = 150;
    for (let s=0; s<=segments; s++) {
      const t = s/segments, x = t*W;
      const idx = Math.min(basePeaks.length-1, Math.round(t*(basePeaks.length-1)));
      const sample = basePeaks[idx];
      const wobble = Math.sin(t*6+layerPhase)*0.22 + Math.sin(t*11-layerPhase*1.3)*0.11;
      const y = centerY + (wobble + (sample-0.45)*0.55)*layerAmp*(0.55+0.45*Math.sin(t*Math.PI));
      d += (s===0?`M${x.toFixed(2)},${y.toFixed(2)}`:`L${x.toFixed(2)},${y.toFixed(2)}`);
    }
    const glow = document.createElementNS(NS,'path');
    glow.setAttribute('d', d); glow.setAttribute('fill','none');
    glow.setAttribute('stroke','url(#wg)'); glow.setAttribute('stroke-width','2.4');
    glow.setAttribute('opacity','0.55');
    glow.setAttribute('filter','blur(3px)');
    svg.appendChild(glow);

    const path = document.createElementNS(NS,'path');
    path.setAttribute('d', d); path.setAttribute('fill','none');
    path.setAttribute('stroke','url(#wg)'); path.setAttribute('stroke-width','1.15');
    path.setAttribute('stroke-linecap','round');
    svg.appendChild(path);
  }
}

function paintBars(svg, W, H, progress) {
  const NS = 'http://www.w3.org/2000/svg';
  svg.innerHTML = '';
  const defs = document.createElementNS(NS,'defs');
  const g = document.createElementNS(NS,'linearGradient');
  g.setAttribute('id','bg2'); g.setAttribute('x1','0'); g.setAttribute('y1','0');
  g.setAttribute('x2','0'); g.setAttribute('y2','1');
  [['0',BRIGHT],['1',DEEP]].forEach(([o,c])=>{
    const s=document.createElementNS(NS,'stop');
    s.setAttribute('offset',o); s.setAttribute('stop-color',c); g.appendChild(s);
  });
  defs.appendChild(g); svg.appendChild(defs);

  const barWidth=3, barGap=2.4, step=barWidth+barGap;
  const count = Math.floor(W/step), centerY=H/2;
  const playedX = W*progress;
  for (let i=0;i<count;i++) {
    const x = i*step+barWidth/2;
    const amp = Math.min(1, Math.max(0.05, synthetic(i*1.7)));
    const h = Math.max(3, amp*H);
    const r = document.createElementNS(NS,'rect');
    r.setAttribute('x', x); r.setAttribute('y', centerY-h/2);
    r.setAttribute('width', barWidth); r.setAttribute('height', h);
    r.setAttribute('rx', barWidth);
    if (x <= playedX) { r.setAttribute('fill','url(#bg2)'); }
    else { r.setAttribute('fill','rgba(255,255,255,.2)'); }
    svg.appendChild(r);
  }
}

const meshSvg = document.getElementById('mesh');
const barsSvg = document.getElementById('bars');
let t0 = performance.now();
(function loop(now) {
  const phase = ((now - t0)/1000) * 0.6;
  paintMesh(meshSvg, 320, 190, phase);
  requestAnimationFrame(loop);
})(performance.now());
paintBars(barsSvg, 320, 76, 0.42);
</script>
</body>
</html>
