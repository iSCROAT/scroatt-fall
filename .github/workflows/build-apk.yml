name: Build APK

on:
  push:
    branches:
      - main
      - arena/**
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build do APK"
        type: choice
        options:
          - debug
          - release
        default: debug

# Permissões mínimas + escrita decontents, necessária para publicar o
# log de build no branch de diagnóstico.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flutter 3.35.7 traz Dart 3.9.2 — compatível com `record` 6.x e com o
  # AGP 8.7 usado no projeto Android.
  FLUTTER_VERSION: "3.35.7"
  JAVA_VERSION: "17"

jobs:
  build-apk:
    name: Build ${{ github.event.inputs.build_type || 'debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ---------------------------------------------------------------
      # 1. Flutter SDK
      # ---------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # O Flutter já traz o sdkmanager/avdmanager necessários e sabe
      # instalar os componentes do Android SDK que faltarem. Por isso não
      # usamos actions/setup-android (que exige rede extra e falha em
      # runners sem toolcache completo).
      - name: Set up Android SDK components
        run: |
          flutter config --android-sdk "$ANDROID_HOME" || true
          yes | flutter doctor --android-licenses > /dev/null 2>&1 || true
          # NDK 27.0.12077973 é a versão fixada pelo Flutter 3.35.7.
          sdkmanager --install "platform-tools" "platforms;android-36" \
            "build-tools;35.0.0" "ndk;27.0.12077973" > /dev/null 2>&1 || true
          sdkmanager --list_installed 2>/dev/null || true

      # ---------------------------------------------------------------
      # 2. Dependências
      # ---------------------------------------------------------------
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ runner.temp }}/pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Get packages
        working-directory: app
        shell: bash
        run: |
          set -uo pipefail
          flutter pub get 2>&1 | tee pubget.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            {
              echo "### pub get"
              echo '```'
              cat pubget.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Publica o log pelo mesmo caminho usado pelo step de log do
            # build, que ja e conhecido por funcionar no runner.
            WORK="$(mktemp -d)"
            {
              echo "## pub get - run ${{ github.run_id }}"
              echo
              echo '```'
              cat pubget.log
              echo '```'
            } > "$WORK/pubget-${{ github.run_id }}.md"
            rm -rf "$WORK/repo"
            git clone --depth=1 --branch "${{ github.ref_name }}" \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
              "$WORK/repo" 2>&1 | tail -3 || true
            if [ -d "$WORK/repo/.git" ]; then
              cd "$WORK/repo"
              mkdir -p ci-logs
              cp "$WORK/pubget-${{ github.run_id }}.md" "ci-logs/pubget-${{ github.run_id }}.md"
              git add -A ci-logs
              git -c user.name="github-actions[bot]" \
                  -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit -m "ci: log do pub get ${{ github.run_id }}" || true
              git push origin "HEAD:refs/heads/${{ github.ref_name }}" 2>&1 | tail -5 || true
            fi
            exit "$STATUS"
          fi

      # ---------------------------------------------------------------
      # 3. Análise estática
      # ---------------------------------------------------------------
      # O analyzer pega a maioria dos erros de compilação antes do Gradle,
      # com mensagens muito mais claras. Falha o pipeline em erros.
      - name: Analyze
        working-directory: app
        run: |
          set -uo pipefail
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          STATUS=${PIPESTATUS[0]}
          if [ "$STATUS" -ne 0 ]; then
            {
              echo "### Análise estática"
              echo '```'
              cat analyze.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error title=Analyzer::${line:0:900}"
            done < <(grep -E "error •| error - " analyze.log | head -n 12)
          fi
          exit $STATUS

      # ---------------------------------------------------------------
      # 4. Build do APK
      # ---------------------------------------------------------------
      - name: Build APK (${{ github.event.inputs.build_type || 'debug' }})
        working-directory: app
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          set -uo pipefail
          # `--split-per-abi` gera um APK por arquitetura. Sem isso o
          # arquivo unico embute as libs nativas de todas as ABIs e passa
          # de 140 MB — grande demais para instalar com folga.
          if [ "$BUILD_TYPE" = "release" ]; then
            flutter build apk --release --split-per-abi 2>&1 | tee build.log
          else
            flutter build apk --debug --split-per-abi 2>&1 | tee build.log
          fi
          STATUS=${PIPESTATUS[0]}
          # Preserva a saída do build no resumo da execução, mesmo em falha.
          {
            echo "### Resultado do build (\`$BUILD_TYPE\`)"
            echo '```'
            tail -n 200 build.log 2>/dev/null || echo "(sem build.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" -ne 0 ]; then
            # Emite o trecho final do log como anotação. Anotações são lidas
            # pela API do GitHub, ao contrário do log completo e dos
            # artefatos, que ficam em hosts inacessíveis de alguns ambientes.
            echo "::group::Trecho final do build"
            tail -n 60 build.log 2>/dev/null || true
            echo "::endgroup::"
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              echo "::error title=Build do APK::${line:0:900}"
            done < <(grep -iE "FAILURE|What went wrong|error:|Caused by" build.log 2>/dev/null | head -n 8)
          fi
          exit $STATUS

      # Publica o log de build em um branch dedicado. O endpoint de logs e o
      # storage de artefatos do GitHub não estão acessíveis a partir de
      # todos os ambientes, então gravamos o log via git — que funciona.
      #
      # Se a publicação falhar, o erro é exibido como anotação para que
      # possa ser diagnosticado pela API do GitHub.
      - name: Publish build log to branch
        if: always()
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          set -uo pipefail
          WORK="$(mktemp -d)"
          if [ -f app/build.log ]; then
            SRC=app/build.log
          elif [ -f app/analyze.log ]; then
            SRC=app/analyze.log
          else
            echo "nenhum log disponível" > "$WORK/build.log"
            SRC="$WORK/build.log"
          fi
          {
            echo "## Build $BUILD_TYPE — run ${{ github.run_id }}"
            echo
            echo '```'
            tail -n 250 "$SRC"
            echo '```'
            if [ -f app/apk-inventory.txt ]; then
              echo
              cat app/apk-inventory.txt
            fi
          } > "$WORK/build-${{ github.run_id }}.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf "$WORK/repo"
          git clone --depth=1 --branch "${{ github.ref_name }}" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "$WORK/repo" 2>&1 | tail -3 || {
              echo "::error::falha ao clonar o repositório para publicar o log"
              exit 0
            }
          cd "$WORK/repo"
          mkdir -p ci-logs
          cp "$WORK/build-${{ github.run_id }}.md" "ci-logs/build-${{ github.run_id }}.md"
          ls -la ci-logs/
          git add -A ci-logs
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "ci: log do build ${{ github.run_id }}" || true
          git push origin "HEAD:refs/heads/${{ github.ref_name }}" 2>&1 | tail -5

      # ---------------------------------------------------------------
      # 5. Artefato baixável
      # ---------------------------------------------------------------
      - name: Collect APKs
        run: |
          mkdir -p artifacts
          # Renomeia cada APK para o nome da arquitetura, deixando claro
          # qual instalar: `scroatt-arm64-v8a-debug.apk` e c.
          for apk in app/build/app/outputs/flutter-apk/*.apk; do
            [ -e "$apk" ] || continue
            base=$(basename "$apk" .apk)     # ex.: app-arm64-v8a-debug
            # `app-<abi>-<tipo>` -> `scroatt-<abi>-<tipo>`
            name=$(echo "$base" | sed -E 's/^app-(.+)$/scroatt-\1/')
            cp "$apk" "artifacts/${name}.apk"
          done
          # Checksum SHA-256 de cada APK: permite confirmar que o
          # download não foi corrompido antes de instalar. Gerado DEPOIS
          # da renomeacao, para os nomes no checksum corresponderem aos
          # arquivos publicados.
          (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)
          # Anexa o log do build para diagnóstico quando algo falha.
          [ -f app/build.log ] && cp app/build.log artifacts/build.log || true
          ls -lh artifacts/
          echo "--- checksums ---"
          cat artifacts/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scroatt-apk-${{ github.event.inputs.build_type || 'debug' }}
          path: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log (diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: |
            app/build.log
            artifacts/build.log
          if-no-files-found: ignore
          retention-days: 7

      # ---------------------------------------------------------------
      # 5b. Inventario dos APKs
      #
      # Publica o tamanho e o checksum de cada APK para que o download
      # possa ser conferido antes da instalacao.
      - name: APK inventory
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          INVENTORY="app/apk-inventory.txt"
          {
            echo "# APKs gerados - run $RUN_ID"
            echo
            if ls artifacts/*.apk >/dev/null 2>&1; then
              echo '| Arquivo | Tamanho |'
              echo '|---|---|'
              for apk in artifacts/*.apk; do
                size=$(du -h "$apk" | cut -f1)
                bytes=$(stat -c%s "$apk")
                echo "| $(basename "$apk") | $size ($bytes bytes) |"
              done
              echo
              echo '## SHA-256'
              echo
              echo '```'
              cat artifacts/SHA256SUMS.txt 2>/dev/null || echo "(sem checksum)"
              echo '```'
            else
              echo "(nenhum APK gerado)"
            fi
          } > "$INVENTORY"
          cat "$INVENTORY"
          {
            echo "### APKs gerados"
            echo '```'
            cat "$INVENTORY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------------
      # 5c. Publica o inventario dos APKs no repositorio
      #
      # O step acima grava o inventario no resumo da execucao; este
      # step deixa o arquivo no branch, onde o inventario de cada build
      # fica no historico para consulta.
      - name: Publish APK inventory
        if: always()
        run: |
          set -uo pipefail
          [ -f app/apk-inventory.txt ] || exit 0

          WORK="$(mktemp -d)"
          rm -rf "$WORK/repo"
          git clone --depth=1 --branch "${{ github.ref_name }}" \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "$WORK/repo" 2>&1 | tail -3 || exit 0
          cd "$WORK/repo"
          mkdir -p ci-logs
          cp "$GITHUB_WORKSPACE/app/apk-inventory.txt" \
            "ci-logs/apks-${{ github.run_id }}.md"
          git add -A ci-logs
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "ci: inventario dos APKs ${{ github.run_id }}" || true
          git push origin "HEAD:refs/heads/${{ github.ref_name }}" 2>&1 | tail -3

      # ---------------------------------------------------------------
      # 6. Release (apenas na main, quando há tag)
      # ---------------------------------------------------------------
      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          draft: true
          generate_release_notes: true
