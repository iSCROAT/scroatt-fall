name: Build APK

on:
  push:
    branches:
      - main
      - arena/**
  pull_request:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Tipo de build do APK"
        type: choice
        options:
          - debug
          - release
        default: debug

# Permissões mínimas + escrita decontents, necessária para publicar o
# log de build no branch de diagnóstico.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flutter 3.35.7 traz Dart 3.9.2 — compatível com `record` 6.x e com o
  # AGP 8.7 usado no projeto Android.
  FLUTTER_VERSION: "3.35.7"
  JAVA_VERSION: "17"

jobs:
  build-apk:
    name: Build ${{ github.event.inputs.build_type || 'debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ---------------------------------------------------------------
      # 1. Flutter SDK
      # ---------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # O Flutter já traz o sdkmanager/avdmanager necessários e sabe
      # instalar os componentes do Android SDK que faltarem. Por isso não
      # usamos actions/setup-android (que exige rede extra e falha em
      # runners sem toolcache completo).
      - name: Set up Android SDK components
        run: |
          flutter config --android-sdk "$ANDROID_HOME" || true
          yes | flutter doctor --android-licenses > /dev/null 2>&1 || true
          # NDK 27.0.12077973 é a versão fixada pelo Flutter 3.35.7.
          sdkmanager --install "platform-tools" "platforms;android-36" \
            "build-tools;35.0.0" "ndk;27.0.12077973" > /dev/null 2>&1 || true
          sdkmanager --list_installed 2>/dev/null || true

      # ---------------------------------------------------------------
      # 2. Dependências
      # ---------------------------------------------------------------
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ${{ runner.temp }}/pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('app/pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Get packages
        working-directory: app
        run: flutter pub get

      # ---------------------------------------------------------------
      # 3. Análise estática (não bloqueia o build)
      # ---------------------------------------------------------------
      - name: Analyze
        working-directory: app
        continue-on-error: true
        run: flutter analyze --no-fatal-infos

      # ---------------------------------------------------------------
      # 4. Build do APK
      # ---------------------------------------------------------------
      - name: Build APK (${{ github.event.inputs.build_type || 'debug' }})
        working-directory: app
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          set -uo pipefail
          if [ "$BUILD_TYPE" = "release" ]; then
            flutter build apk --release --split-per-abi 2>&1 | tee build.log
          else
            flutter build apk --debug 2>&1 | tee build.log
          fi
          STATUS=${PIPESTATUS[0]}
          # Preserva a saída do build no resumo da execução, mesmo em falha.
          {
            echo "### Resultado do build (\`$BUILD_TYPE\`)"
            echo '```'
            tail -n 150 build.log 2>/dev/null || echo "(sem build.log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Em caso de falha, publica as linhas de erro como anotações. As
          # anotações são lidas pela API do GitHub, ao contrário do log
          # completo, que nem sempre está acessível.
          if [ "$STATUS" -ne 0 ]; then
            {
              echo "::group::Erro de build"
              grep -n -iE "error|failed|exception|FAILURE|what went wrong" build.log \
                | head -n 25 || true
              echo "::endgroup::"
              echo "::error title=Falha no build do APK::$(grep -iE 'FAILURE|What went wrong|error:' build.log | head -n 3 | tr '\n' ' ' | cut -c1-900)"
            } >> "$GITHUB_OUTPUT_FILE" 2>/dev/null || true

            # Anotações também podem ser emitidas por stdout.
            grep -iE "FAILURE|What went wrong" build.log | head -n 2 \
              | cut -c1-900 \
              | while IFS= read -r line; do
                echo "::error title=Gradle::$line"
              done
          fi
          exit $STATUS

      # Publica o log de build em um branch dedicado. O endpoint de logs e o
      # storage de artefatos do GitHub não estão acessíveis a partir de
      # todos os ambientes, então gravamos o log via git — que funciona.
      #
      # Se a publicação falhar, o erro é exibido como anotação para que
      # possa ser diagnosticado pela API do GitHub.
      - name: Publish build log to branch
        if: always()
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'debug' }}
        run: |
          set -uo pipefail
          WORK="$(mktemp -d)"
          if [ -f app/build.log ]; then
            SRC=app/build.log
          else
            echo "build.log não encontrado" > "$WORK/build.log"
            SRC="$WORK/build.log"
          fi
          {
            echo "## Build $BUILD_TYPE — run ${{ github.run_id }}"
            echo
            echo '```'
            tail -n 250 "$SRC"
            echo '```'
          } > "$WORK/build-${{ github.run_id }}.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf "$WORK/repo"
          git clone --depth=1 --branch main \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "$WORK/repo" || {
              echo "::error::falha ao clonar o repositório para publicar o log"
              exit 0
            }
          cd "$WORK/repo"
          mkdir -p ci-logs
          cp "$WORK/build-${{ github.run_id }}.md" "ci-logs/"
          git add "ci-logs/build-${{ github.run_id }}.md"
          git commit -m "ci: log do build ${{ github.run_id }}" || true
          git push origin HEAD:refs/heads/ci-logs 2>&1 | tail -5

      # ---------------------------------------------------------------
      # 5. Artefato baixável
      # ---------------------------------------------------------------
      - name: Collect APKs
        run: |
          mkdir -p artifacts
          find app/build/app/outputs/flutter-apk -name "*.apk" -exec cp {} artifacts/ \; || true
          # Anexa o log do build para diagnóstico quando algo falha.
          [ -f app/build.log ] && cp app/build.log artifacts/build.log || true
          ls -lh artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: scroatt-apk-${{ github.event.inputs.build_type || 'debug' }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log (diagnóstico)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: |
            app/build.log
            artifacts/build.log
          if-no-files-found: ignore
          retention-days: 7

      # ---------------------------------------------------------------
      # 6. Release (apenas na main, quando há tag)
      # ---------------------------------------------------------------
      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          draft: true
          generate_release_notes: true
